name: Build Android APK - Ambalan La Surullah

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Dependencies
        run: bun install

      - name: Build Web Application
        run: bun run build

      - name: Create Android Project
        run: bunx cap add android

      - name: Apply Pettalopo Mobile App Icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open("public/assets/pettalopo-logo.png").convert("RGBA")
          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }
          foreground_sizes = {
              "mdpi": 108,
              "hdpi": 162,
              "xhdpi": 216,
              "xxhdpi": 324,
              "xxxhdpi": 432,
          }

          for density, size in sizes.items():
              folder = Path(f"android/app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              logo = source.copy()
              logo.thumbnail((int(size * 0.82), int(size * 0.82)), Image.Resampling.LANCZOS)
              canvas.alpha_composite(logo, ((size - logo.width) // 2, (size - logo.height) // 2))
              canvas.save(folder / "ic_launcher.png")
              canvas.save(folder / "ic_launcher_round.png")

              fg_size = foreground_sizes[density]
              fg_folder = Path(f"android/app/src/main/res/mipmap-{density}")
              foreground = Image.new("RGBA", (fg_size, fg_size), (0, 0, 0, 0))
              fg_logo = source.copy()
              fg_logo.thumbnail((int(fg_size * 0.72), int(fg_size * 0.72)), Image.Resampling.LANCZOS)
              foreground.alpha_composite(fg_logo, ((fg_size - fg_logo.width) // 2, (fg_size - fg_logo.height) // 2))
              foreground.save(fg_folder / "ic_launcher_foreground.png")
          PY

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ambalan-La-Surullah-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
