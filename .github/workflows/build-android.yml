name: Build APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Ambil Kode
        uses: actions/checkout@v4

      - name: 2. Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install & Build Web
        run: |
          npm install
          npm run build

      - name: 6. Buat Proyek Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 7. Buat File APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Simpan APK Siap Download
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Ambalan-Petta-Lopo
          path: android/app/build/outputs/apk/debug/app-debug.apk
